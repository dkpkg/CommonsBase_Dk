# Bounded automatic retry for nondeterministic distribute failures -- the
# recurring Apple clang/linker SIGSEGV on the macOS legs (run 33178191072;
# same signature as rust-lang/rust issue 158787 and spiceai issue 13614: a
# spurious ld-prime crash class on GitHub's macOS runners with no fix
# upstream, where the accepted mitigation is retry). Issue ids are spelled
# out unlinked on purpose -- owner/repo#N or issue-URL forms, if ever copied
# into a commit message or PR text, create reference spam on those
# projects' issue timelines.
#
# This must be a companion workflow, not a job inside distribute-0.1:
# GitHub rejects a rerun while the run is in progress, and any in-run job
# keeps the run in progress (smoke run 33191566554 proved it: "cannot be
# rerun; This workflow is already running"). workflow_run fires after the
# watched run completes, when a rerun is accepted (the 2026-08-28 manual
# `gh run rerun --failed` of run 33178191072 proved that path).
#
# Bounds and safety:
# - run_attempt < 3 => at most 3 attempts total, then humans take over. A
#   failed rerun attempt re-fires this workflow with run_attempt bumped, so
#   the loop converges; success/cancelled/skipped conclusions never retry.
# - Deterministic failures never retry: a distribute leg that fails on
#   value-id drift uploads a dk-patches patch whose ADDED lines carry a new
#   value-id. A rerun rebuilds the identical tree and produces the identical
#   drift, so when any such patch exists this workflow exits without
#   rerunning; the fix is reconciling dist/*.u from the patches. A patch that
#   is merely non-empty does not qualify: a crashed leg writes its error
#   transcript into the same diff, which is how run 33648774264 was denied
#   the retry this workflow exists to perform.
# - `gh run rerun --failed` restarts only failed jobs; successful matrix
#   legs keep their artifacts, and the skipped `combine` re-runs as their
#   dependent on the new attempt.
# - No dk-distribution environment, no secrets, actions:write only: this
#   workflow cannot touch signing or releases.
name: distribute-0.1-auto-rerun

on:
  workflow_run:
    workflows: [distribute-0.1]
    types: [completed]

jobs:
  rerun-failed:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    permissions:
      actions: write # POST .../actions/runs/<id>/rerun-failed-jobs
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }
      - name: Re-run failed jobs of ${{ github.event.workflow_run.name }} run ${{ github.event.workflow_run.id }} (completed attempt ${{ github.event.workflow_run.run_attempt }})
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        # -R: no checkout in this job, so gh cannot infer the repository.
        run: |
          set -euf
          # Deterministic-failure gate: a value-id drift failure uploads a
          # patch whose ADDED lines carry a new value-id. Retrying rebuilds
          # the same tree and reproduces the same drift, so skip the rerun.
          #
          # Non-emptiness is NOT that signal, and testing for it was a bug.
          # The patch is the `distribute --diff` transcript, so a leg that
          # CRASHES writes its error text where a passing test line was
          # expected, and leaves a non-empty patch carrying no value-id change
          # at all. The size test therefore declined to retry an Apple clang
          # linker SIGSEGV twice on run 33648774264: the failing leg patches
          # were 1673 and 1819 bytes with no value-id line in either, every
          # passing leg left 0 bytes, and all three attempts of that release
          # were started by a human. The retry this file exists to perform
          # has never fired on the crash class it names at the top.
          #
          # The asymmetry decides which way the test points. Declining on a
          # crash costs a person three manual reruns and blocks a release.
          # Retrying a real drift costs at most two more runs, changes
          # nothing, and is still bounded by run_attempt < 3, with the drift
          # patch uploaded either way. So retry unless a POSITIVE drift
          # signal is present, rather than unless a crash can be ruled out.
          for aid in $(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name | startswith("patches-")) | .id'); do
            gh api "repos/${REPO}/actions/artifacts/${aid}/zip" > patches.zip
            rm -rf p && mkdir p && unzip -o -q patches.zip -d p
            if find p -name '*.patch' -size +0c -exec grep -lE '^[+].*value-id:' {} + | grep -q .; then
              echo "::notice::value-id drift patch found (artifact ${aid});" \
                "deterministic failure, not rerunning. Reconcile dist/*.u" \
                "from the patches-* artifacts and push a new tag."
              exit 0
            fi
          done
          gh run rerun "${RUN_ID}" --failed -R "${REPO}"
