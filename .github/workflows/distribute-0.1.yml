on:
  push:
    tags:
      - '0.1.*' # secrets are tied to version 0.1
  workflow_dispatch: # allow manual triggering from GitHub page

jobs:
  distribute:
    # The secrets created by `./dk0 prepare-version --ci github VERSION`
    # are tied to this environment only.
    environment: dk-distribution

    strategy:
      fail-fast: false
      matrix:
        include:
            # curl and build-essential are part of ubuntu-24.04 CI runner, so test with:
            #   docker run -v .:/work --workdir /work -it ubuntu:24.04 bash -c "apt update && apt install -y curl build-essential && sh ./dk0 distribute --actual-in-place --library CommonsBase_Dk@0.1.99 part1 dist/any.u"
            #   docker run -v .:/work --workdir /work -it quay.io/pypa/manylinux_2_28_x86_64:2026.04.08-5 sh ./dk0 distribute --actual-in-place --library CommonsBase_Dk@0.1.99 part1 dist/any.u
          # Linux builds run in the manylinux glibc 2.28 container (matches
          # CommonsLang_OCaml): the DkML compiler was built there and its
          # ocamlopt hardcodes gcc-toolset-14's assembler, absent on a plain
          # ubuntu-latest runner.
          - runs-on: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.04.08-5
            distscript: dist/Linux_x86.u
            target-abi: Linux_x86
          - runs-on: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.04.08-5
            distscript: dist/Linux_x86_64.u
            target-abi: Linux_x86_64
          # Re-enable Linux arm64 only when every distribution job uses the same
          # experimental-mlfront-ref setting. Mixing bootstrap paths changes the
          # producer application version and causes `combine` to fail.
          # - runs-on: ubuntu-24.04-arm
          #   distscript: dist/Linux_arm64.u
          #   # BOOTSTRAP ALERT: Until dk0 is bootstrapped with native Linux
          #   # arm64 support, we have to build dk0 arm64 with ocaml/setup-ocaml.
          #   experimental-mlfront-ref: true
          #   # RedHat only distributes date versioned manylinux images for a few
          #   # months. Use
          #   # https://quay.io/repository/pypa/manylinux_2_28_aarch64?tab=tags&tag=latest
          #   # to get a new version.
          - runs-on: macos-latest
            distscript: dist/Darwin_arm64.u
            execution-abi: Darwin_arm64
          - runs-on: macos-latest
            distscript: dist/Darwin_x86_64.u
            execution-abi: Darwin_arm64
            target-abi: Darwin_x86_64
          - runs-on: windows-latest
            distscript: dist/Windows_x86.u
            target-abi: Windows_x86
          - runs-on: windows-latest
            distscript: dist/Windows_x86_64.u
          # Windows_arm64 retired: no DkML arm64 toolchain slice, so it shipped no
          # dk0/dk1 executable (cache-only). Re-add when an arm64 toolchain lands.

    runs-on: ${{ matrix.runs-on }}
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Harden Runner # Optional but recommended
        continue-on-error: true
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare Linux_x86 multilib toolchain
        if: ${{ matrix.distscript == 'dist/Linux_x86.u' }}
        run: dnf install -y glibc-devel.i686 libgcc.i686 libstdc++.i686 gcc-toolset-14-libstdc++-devel.i686

      - name: Distribute Modules
        uses: diskuv/dk-distribute@v3
        with:
            pubkey: ${{ secrets.distribute_0_1_pubkey }}
            seckey: ${{ secrets.distribute_0_1_seckey }}
            options: -nosysinc
            # store: none forces a full clean rebuild. store: release restores
            # the last release's objects by value-id, but the Dk0/Dk1/Pkg
            # value-ids are declaration-based and do NOT change on a MlFront
            # *source* bump, so a restore cache-hits and republishes stale
            # binaries (a 2.4.2.291 source bump republished rev-287). Until the
            # value-ids track the source (see the value-id-tracks-source design
            # task), a source-bump release must build clean. Restore store:
            # release for incremental non-source-bump releases.
            store: none
            distscript: ${{ matrix.distscript }}
            execution-abi: ${{ matrix.execution-abi }}
            target-abi: ${{ matrix.target-abi }}
            experimental-mlfront-ref: ${{ github.ref_type != 'tag' && 'HEAD' }}

  combine:
    needs: distribute
    permissions:
      contents: write # for action-gh-release
      id-token: write # for actions/attest-build-provenance
      attestations: write # for actions/attest-build-provenance
      #   required but does not work in `act`! bug: https://github.com/nektos/act/issues/6025
      artifact-metadata: write # for actions/attest-build-provenance

    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner # Optional but recommended
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Combine Modules
        uses: diskuv/dk-distribute/combine@v3

      - name: Attest
        id: attest
        uses: actions/attest-build-provenance@v3
        with: { subject-path: dk-dist/* }

      - name: Release ${{ github.job }}
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1. Mar 15, 2026
        with: { files: dk-dist/*, body_path: ".dist-CHANGELOG.txt" }
