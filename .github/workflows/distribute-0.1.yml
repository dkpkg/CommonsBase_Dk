# The explicit name is REQUIRED: distribute-0.1-auto-rerun.yml matches this
# workflow by name to auto-retry nondeterministic failures (the macOS
# clang/linker SIGSEGV class). Keep the two in sync if renaming.
name: distribute-0.1

on:
  push:
    tags:
      - '0.1.*' # secrets are tied to version 0.1
  workflow_dispatch: # allow manual triggering from GitHub page

jobs:
  # Fail fast if a checked-in closure driver drifted from the imported
  # CommonsLang_OCaml rule versions (the 2026-08-20 stale-driver incident):
  # catch it in seconds here instead of hours into the per-package build.
  refresh-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Check opam driver freshness
        run: |
          ./dk0 --dangerously-trust-all dialog \
            CommonsLang_OCaml.Dk.OpamLock.Refresh@1.1.16 mode=check \
            'drivers[]=etc/dk/v/CommonsBase_Dk/Dk0.Closure.values.jsonc' \
            'drivers[]=etc/dk/v/CommonsBase_Dk/Dk1.Closure.values.jsonc' \
            'drivers[]=etc/dk/v/CommonsBase_Dk/TestPkg.Closure.values.jsonc'

  distribute:
    needs: refresh-check
    # The secrets created by `./dk0 prepare-version --ci github VERSION`
    # are tied to this environment only.
    environment: dk-distribution

    strategy:
      fail-fast: false
      matrix:
        include:
            # curl and build-essential are part of ubuntu-24.04 CI runner, so test with:
            #   docker run -v .:/work --workdir /work -it ubuntu:24.04 bash -c "apt update && apt install -y curl build-essential && sh ./dk0 distribute --actual-in-place --library CommonsBase_Dk@0.1.99 part1 dist/any.u"
            #   docker run -v .:/work --workdir /work -it quay.io/pypa/manylinux_2_28_x86_64:2026.04.08-5 sh ./dk0 distribute --actual-in-place --library CommonsBase_Dk@0.1.99 part1 dist/any.u
          # Linux builds run in the manylinux glibc 2.28 container (matches
          # CommonsLang_OCaml): the DkML compiler was built there and its
          # ocamlopt hardcodes gcc-toolset-14's assembler, absent on a plain
          # ubuntu-latest runner.
          - runs-on: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.04.08-5
            distscript: dist/Linux_x86.u
            target-abi: Linux_x86
          - runs-on: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.04.08-5
            distscript: dist/Linux_x86_64.u
            target-abi: Linux_x86_64
          # Linux_x86_64_musl retired (2026-08-12): its musl-linked host tools
          # (ocamlfind/ocamlbuild) shared the glibc Linux_x86_64 slot's
          # execution-ABI value-id, so combine could ship a musl ocamlfind that
          # ENOENTs on the glibc manylinux host. Proper musl support is blocked
          # on CommonsLang_OCaml issues #2/#3 (non-relocatable, non-PIE glibc
          # DkML compiler); Linux consumers use the manylinux (glibc) container
          # until then.
          # Re-enable Linux arm64 only when every distribution job uses the same
          # experimental-mlfront-ref setting. Mixing bootstrap paths changes the
          # producer application version and causes `combine` to fail.
          # - runs-on: ubuntu-24.04-arm
          #   distscript: dist/Linux_arm64.u
          #   # BOOTSTRAP ALERT: Until dk0 is bootstrapped with native Linux
          #   # arm64 support, we have to build dk0 arm64 with ocaml/setup-ocaml.
          #   experimental-mlfront-ref: true
          #   # RedHat only distributes date versioned manylinux images for a few
          #   # months. Use
          #   # https://quay.io/repository/pypa/manylinux_2_28_aarch64?tab=tags&tag=latest
          #   # to get a new version.
          - runs-on: macos-latest
            distscript: dist/Darwin_arm64.u
            execution-abi: Darwin_arm64
          - runs-on: macos-latest
            distscript: dist/Darwin_x86_64.u
            execution-abi: Darwin_arm64
            target-abi: Darwin_x86_64
          - runs-on: windows-latest
            distscript: dist/Windows_x86.u
            target-abi: Windows_x86
          - runs-on: windows-latest
            distscript: dist/Windows_x86_64.u
          # Windows_arm64 retired: no DkML arm64 toolchain slice, so it shipped no
          # dk0/dk1 executable (cache-only). Re-add when an arm64 toolchain lands.

    runs-on: ${{ matrix.runs-on }}
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Harden Runner # Optional but recommended
        continue-on-error: true
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare Linux_x86 multilib toolchain
        if: ${{ matrix.distscript == 'dist/Linux_x86.u' }}
        run: dnf install -y glibc-devel.i686 libgcc.i686 libstdc++.i686 gcc-toolset-14-libstdc++-devel.i686

      # Derive the `sbom self` build identity for the flat dk0/dk1 from the same
      # pinned MlFront source this job builds. The repin step is the single
      # source of truth, so these track it with no separate value to keep in
      # sync: DK_SBOM_GITREF and DK_SBOM_SOURCE_SHA256 come straight out of the
      # RawSrc pin file, and DK_SBOM_SLOT is the slot this leg targets (the
      # distscript basename). MlFront's SbomEmbedded dune rule reads these, so a
      # released binary's `sbom self` shows the real gitref, source digest and
      # slot instead of the dev placeholders. bash is available on every runner
      # (the manylinux container, macOS, and Git bash on windows-latest).
      - name: Derive SBOM build identity
        shell: bash
        run: |
          set -eu
          f=etc/dk/v/CommonsBase_Dk/Dk0Localize.RawSrc.values.jsonc
          gitref=$(grep -oE 'MlFront-[0-9][0-9.]*\.zip' "$f" | head -1 | sed -E 's/^MlFront-//; s/\.zip$//')
          sha=$(grep -oiE '"sha256"[[:space:]]*:[[:space:]]*"[0-9a-f]{64}"' "$f" | head -1 | grep -oiE '[0-9a-f]{64}')
          slot="Release.$(basename '${{ matrix.distscript }}' .u)"
          if [ -z "$gitref" ] || [ -z "$sha" ]; then
            echo "::error::Could not derive DK_SBOM_GITREF/DK_SBOM_SOURCE_SHA256 from $f"; exit 1
          fi
          {
            echo "DK_SBOM_GITREF=$gitref"
            echo "DK_SBOM_SOURCE_SHA256=$sha"
            echo "DK_SBOM_SLOT=$slot"
          } >> "$GITHUB_ENV"
          echo "sbom identity: gitref=$gitref slot=$slot sha256=$sha"

      - name: Distribute Modules
        uses: diskuv/dk-distribute@v4
        env:
            # Xcode pin FALLBACK for the nondeterministic clang/linker SIGSEGV
            # on the Darwin_x86_64 cross slot (run 33178191072: two attempts,
            # `clang: error: unable to execute command: Segmentation fault: 11`
            # while linking -arch x86_64 output on the arm64 runner). Evidence
            # shows Xcode 26.6 both passing and crashing on the same image, so
            # this ships COMMENTED. Flip it only if crashdiag-* rate data
            # implicates a specific Xcode; pick the value from the Xcode
            # inventory recorded in any crashdiag-* artifact's env.txt.
            # Harmless on Linux/Windows legs (nothing reads it).
            # DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
            #
            # `sbom self` build identity, derived by the previous step from the
            # pinned MlFront source. Passed through here (the proven channel, the
            # same way DK0_BASE_URL reaches the build) so MlFront's SbomEmbedded
            # dune rule sees them when it compiles the flat dk0/dk1.
            DK_SBOM_GITREF: ${{ env.DK_SBOM_GITREF }}
            DK_SBOM_SOURCE_SHA256: ${{ env.DK_SBOM_SOURCE_SHA256 }}
            DK_SBOM_SLOT: ${{ env.DK_SBOM_SLOT }}
            # TODO(sbom): DK_SBOM_TOOLCHAIN_OCAMLCOMMON_SHA256 -- sha256 of the
            # staged DkML compiler's lib/ocaml/compiler-libs/ocamlcommon.cmxa.
            # That file only exists inside the diskuv/dk-distribute sandbox
            # (a member of the imported CommonsLang_OCaml.DkML
            # object), so it needs a compute-and-export step inside the build
            # rather than a literal here. Left unset for now: MlFront omits the
            # toolchain fingerprint property when the value is empty, so the rest
            # of the SBOM is unaffected until this is wired.
            # PERMANENT explicit driver pin -- determinism over auto-updates.
            # (Without it dk0 floats on the LATEST signed manifest, and the
            # 2.4.2.296 driver's github-l2 import regression silently broke
            # every build here the moment its manifest became latest.) Bump the
            # version deliberately, as a reviewed commit, when adopting a new
            # driver release; the pinned manifest is signify-verified by the
            # launcher exactly like the floating one.
            #
            # 2.4.2.308 is the first driver manifest that carries a
            # dk0_linux_x86_64_musl build, so a musl-detecting launcher can
            # resolve every ABI from it. It succeeds 2.4.2.301, the first
            # shallow-import driver that could build this closure (import
            # idempotency fix + strict materialized-only trace import).
            #
            # 2.4.2.320 is the first driver whose lazy-import force keys
            # invalidation on local accountability, so a lazily imported
            # foreign value (ex. CommonsLang_OCaml.DkML) is never invalidated
            # into "[917b6e5f] ... it does not exist" when the MlFront source
            # being built is not the driver's own version (see MlFront
            # Assumptions.a_lazy_value_invalidation_requires_a_local_rebuild_path).
            # Drivers 2.4.2.315-2.4.2.319 fail this distribute on any such
            # version skew and must not be pinned here.
            #
            # 2.4.2.342 is the first driver whose engine implements the
            # in-process `--zip` special form. This release converts the
            # archive-creation sites (Dk0.MlFrontSource output.zip, TestPkg
            # prefix.zip) from staged `7zz -tzip` to `--zip`; a driver < 342
            # treats the `--zip` word as a missing executable and fails the
            # distribute with `command not found: .../--zip` (bumped up from
            # 2.4.2.322 for exactly that reason).
            DK0_BASE_URL: https://gitlab.com/api/v4/projects/60486861/packages/generic/dk-dist/2.4.2.342
            # The dk1 orchestrator's launcher reads DK1_BASE_URL, not
            # DK0_BASE_URL; same signed manifest (it carries the dk1 binaries
            # too). Keep both pins in lockstep.
            DK1_BASE_URL: https://gitlab.com/api/v4/projects/60486861/packages/generic/dk-dist/2.4.2.342
        with:
            pubkey: ${{ secrets.distribute_0_1_pubkey }}
            seckey: ${{ secrets.distribute_0_1_seckey }}
            # Plain -nosysinc: under the fixed shallow-import driver, deferred
            # transitive values fetch on demand through the lazy force; no
            # --integrity flag is needed (verified locally end to end).
            options: -nosysinc
            # The dist/*.u scripts run CommonsBase_FileMagic's file(1) to verify
            # each dk0/dk1 binary is compiled for its ABI. FileMagic is already
            # in the closure transitively (via CommonsBase_GNU and
            # CommonsLang_OCaml), so no dk.u import is added; trust its producer
            # key here so CI accepts it (CI has no terminal to accept unknown
            # producer keys).
            trust-packages: 'CommonsBase_FileMagic'
            # store: none for this cut. The closures move to F_BuildLockedPackage
            # @1.0.15 (v6 wrapper) to fix the imported ppxlib compiler-libs skew:
            # under the v5 wrapper (@1.0.11) ppxlib's astlib.cmxa recorded a foreign
            # compiler-libs Location implementation CRC (f7facf49) instead of the
            # shipped one (0a03b0f1), so no consumer's locally-built ppx.exe could
            # relink it. A package object's value id does NOT vary with the build
            # rule version, so a store:release restore would serve the previous
            # release's v5-built objects (the broken ppxlib among them) and silently
            # no-op the rule bump; a full-closure invalidation under store:release
            # also pays the per-object restore/lazy-force overhead that ran past the
            # 6h job limit (the 2.4.2.318 proof). store:none rebuilds the whole
            # closure cold under @1.0.15 (~35min) so the fix actually lands. The
            # earlier store:release topfind failure ("Cannot find file topfind", a
            # restored ocamlfind content object) only bites on restore, so it cannot
            # occur on a cold build; restore store:release once its full-closure
            # restore path is made performant.
            #
            # CROSS-SLOT INVARIANT (independent of the toggle above): the three
            # cross slots (Linux_x86, Windows_x86, Darwin_x86_64, where
            # execution-abi != target-abi) must NEVER use store: release. Since
            # dk0 2.4.2.323 a cross-built object's value-id includes the resolved
            # target ABI, so a restore from a pre-2.4.2.323 (unsuffixed) release
            # is partially rejected mid-build and contaminates the closure with
            # host-ABI content -- the mechanism that shipped mislabeled 64-bit
            # binaries in ocamlearlybird 1.3.202608152325's Linux_x86/Windows_x86
            # stores. The expression forces those three to none structurally, so
            # setting DK_STORE=release (to speed up native slots later) cannot
            # accidentally un-pin them. Revert only when the dk engine cross-id
            # plumbing is unified and a clean suffixed CBD release exists.
            store: ${{ (matrix.distscript == 'dist/Linux_x86.u' || matrix.distscript == 'dist/Windows_x86.u' || matrix.distscript == 'dist/Darwin_x86_64.u') && 'none' || vars.DK_STORE || 'none' }}
            distscript: ${{ matrix.distscript }}
            execution-abi: ${{ matrix.execution-abi }}
            target-abi: ${{ matrix.target-abi }}
            experimental-mlfront-ref: ${{ github.ref_type != 'tag' && 'HEAD' }}
            # Also publish the runnable dk0/dk1 as flat, whole-file assets (extracted
            # from the just-built objects) so the installer can curl them directly.
            # The action derives the slot from distscript and stages
            # dk-dist/dk{0,1}-<abi>[.exe]; combine then signs + attests + releases them.
            publish-objects: |
              CommonsBase_Dk.Dk0@2.4.3|./bin/dk0.exe|dk0
              CommonsBase_Dk.Dk1@2.4.3|./bin/dk1.exe|dk1

      # ---- macOS crash diagnostics (nondeterministic clang/linker SIGSEGV on
      # the Darwin_x86_64 cross slot; see run 33178191072). Runs on every macOS
      # leg (always(), not failure()) because dk1 may retry a crashed task
      # in-place and turn the leg green while a linker-crash snapshot is left
      # behind in TMPDIR -- so this artifact doubles as the ongoing crash-rate
      # measurement, and its env.txt records the image's Xcode inventory (the
      # data source for the DEVELOPER_DIR pin above). Must never be able to
      # fail a release leg: continue-on-error on both steps.
      - name: Collect macOS crash diagnostics
        if: ${{ always() && runner.os == 'macOS' }}
        continue-on-error: true
        shell: bash
        run: |
          set -u
          staging="$RUNNER_TEMP/crashdiag"
          mkdir -p "$staging"
          {
            echo "image=${ImageVersion:-unknown} os=${ImageOS:-unknown} attempt=${GITHUB_RUN_ATTEMPT:-?}"
            echo "TMPDIR=${TMPDIR:-unset}"
            ls -d /Applications/Xcode*.app 2>/dev/null
            xcodebuild -version 2>/dev/null
            xcode-select -p 2>/dev/null
          } > "$staging/env.txt" || true
          # Apple crash reports for any crashed clang/ld child (small, safe).
          mkdir -p "$staging/DiagnosticReports"
          cp -R "$HOME/Library/Logs/DiagnosticReports/." "$staging/DiagnosticReports/" 2>/dev/null || true
          # Linker crash snapshots + dune temp dirs. Search both this step's
          # $TMPDIR and all of /var/folders (the build may run under a
          # different per-sandbox TMPDIR; the observed snapshot was
          # /var/folders/.../T/build_XXXXXX_dune/linker-crash-XXXXXX).
          i=0
          sudo -n find "${TMPDIR:-/tmp}" /var/folders \
              -type d \( -name 'linker-crash-*' -o -name 'build_*_dune' \) \
              -print 2>/dev/null | sort -u | while IFS= read -r d; do
            sz=$(sudo -n du -sm "$d" 2>/dev/null | cut -f1)
            if [ "${sz:-0}" -gt 1024 ]; then
              echo "SKIPPED (>1GiB): $d (${sz} MiB)" >> "$staging/env.txt"
              continue
            fi
            i=$((i+1))
            dest="$staging/$(printf '%02d' "$i")-$(basename "$d")"
            sudo -n cp -R "$d" "$dest" 2>/dev/null || true
            echo "captured: $d (${sz:-?} MiB)" >> "$staging/env.txt"
          done
          sudo -n chown -R "$(id -u):$(id -g)" "$staging" || true
          du -sh "$staging" || true
      - name: Upload macOS crash diagnostics
        if: ${{ always() && runner.os == 'macOS' }}
        continue-on-error: true
        # Same pin as dk-distribute's own uploads (v7 == v7.0.1). Use the @v7
        # tag form: dkpkg's org Actions policy allowlists actions/upload-artifact
        # by that pattern, and a raw-SHA pin (043fb46...) is rejected at workflow
        # startup ("not allowed ... must be from a repository owned by dkpkg or
        # match one of the patterns"), which startup-failed the 0.1.20260829075904
        # tag pipeline -- the first tag run to reach these crashdiag steps.
        uses: actions/upload-artifact@v7
        with:
          # Attempt-suffixed so an auto-rerun can never clobber an earlier
          # attempt's evidence; leg-disambiguated because both macOS legs run
          # this (the Darwin_arm64 leg has no target-abi).
          name: crashdiag-${{ matrix.target-abi || matrix.execution-abi }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crashdiag
          if-no-files-found: ignore
          retention-days: 7

  # NOTE: automatic retry of failed jobs lives in a COMPANION workflow,
  # distribute-0.1-auto-rerun.yml (on: workflow_run). It cannot be a job in
  # this workflow: GitHub rejects `gh run rerun` while the run is still in
  # progress, and any job of this run keeps the run in progress (proven by
  # smoke run 33191566554: "cannot be rerun; This workflow is already
  # running").

  combine:
    needs: distribute
    # Same protected environment as `distribute`. It supplies the Azure Trusted
    # Signing app ids (Windows Authenticode via GitHub OIDC federation -- no stored
    # secret) and the Apple Developer ID + notary secrets (macOS). The GitHub OIDC
    # subject is repo:dkpkg/CommonsBase_Dk:environment:dk-distribution; a federated
    # credential on the sp-diskuv-signing-ci Entra app must authorize that subject.
    environment: dk-distribution
    permissions:
      contents: write # for action-gh-release
      id-token: write # for actions/attest-build-provenance
      attestations: write # for actions/attest-build-provenance

    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner # Optional but recommended
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Combine Modules
        uses: diskuv/dk-distribute/combine@v4
        env:
            # Same permanent driver pin as the distribute jobs above; bump
            # both together when adopting a new driver release. DK1_BASE_URL
            # is the dk1 orchestrator's launcher pin; keep in lockstep.
            DK0_BASE_URL: https://gitlab.com/api/v4/projects/60486861/packages/generic/dk-dist/2.4.2.342
            DK1_BASE_URL: https://gitlab.com/api/v4/projects/60486861/packages/generic/dk-dist/2.4.2.342

      # ---- Code-sign the flat dk0/dk1 executables BEFORE Attest + Release ----
      # publish-objects (in the distribute jobs) staged dk-dist/dk{0,1}-<abi>[.exe].
      # Sign ONLY those flat executables here -- the value-store assets are left
      # untouched -- so the attested, released, and later signify-manifest-hashed
      # bytes are the signed bytes (served == attested == signed). File-existence is
      # guarded INSIDE the run: scripts, never with hashFiles() in an if: --
      # hashFiles is invalid in an if: and makes the whole run fail at startup.

      # Windows: Authenticode via Azure Trusted Signing. The official dotnet `sign`
      # CLI is Windows-only (it p/invokes kernel32 and aborts on this Linux runner),
      # so sign with jsign -- a cross-platform (Java) Authenticode signer with native
      # Trusted Signing support. Auth is keyless: exchange the GitHub Actions OIDC
      # token for an Entra access token via the federated credential on
      # sp-diskuv-signing-ci (subject repo:dkpkg/CommonsBase_Dk:environment:dk-distribution).
      - name: Authenticode-sign Windows binaries
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }} # Entra tenant id
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # sp-diskuv-signing-ci app id
        shell: bash
        run: |
          set -euo pipefail
          [ -f dk-dist/dk0-windows_x86_64.exe ] || { echo "no windows binary in dk-dist; skipping Authenticode"; exit 0; }
          # 1) GitHub OIDC token for the Entra token-exchange audience.
          gh_tok=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api%3A%2F%2FAzureADTokenExchange" | jq -r '.value')
          [ -n "$gh_tok" ] && [ "$gh_tok" != null ] || { echo "FATAL: no GitHub OIDC token"; exit 1; }
          # 2) Federated client-credentials exchange -> Trusted Signing access token
          #    (resource https://codesigning.azure.net).
          az_tok=$(curl -fsSL -X POST \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
            -d 'grant_type=client_credentials' \
            -d "client_id=${AZURE_CLIENT_ID}" \
            -d 'scope=https://codesigning.azure.net/.default' \
            -d 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' \
            --data-urlencode "client_assertion=${gh_tok}" | jq -r '.access_token')
          [ -n "$az_tok" ] && [ "$az_tok" != null ] || { echo "FATAL: could not obtain Entra code-signing access token"; exit 1; }
          # 3) jsign (Java preinstalled on ubuntu-latest). Same Trusted Signing
          #    endpoint / account / certificate profile MlFront's sign CLI used.
          curl -fsSL -o "$RUNNER_TEMP/jsign.jar" \
            https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar
          for f in dk-dist/dk0-windows_x86_64.exe dk-dist/dk1-windows_x86_64.exe; do
            [ -f "$f" ] || continue
            java -jar "$RUNNER_TEMP/jsign.jar" \
              --storetype TRUSTEDSIGNING \
              --keystore 'https://wus2.codesigning.azure.net' \
              --storepass "$az_tok" \
              --alias 'diskuv-signing/diskuv-public-trust' \
              --tsmode RFC3161 \
              --tsaurl 'http://timestamp.acs.microsoft.com/' \
              "$f"
          done

      # macOS: Developer ID signature (+ best-effort notarization) via rcodesign,
      # which signs/notarizes Mach-O cross-platform from this Linux runner. A bare
      # Mach-O executable cannot have a notarization ticket stapled, so notarization
      # is best-effort; the Developer ID signature is the gate the installer's
      # `codesign --verify` and the GitLab import's `rcodesign verify` both check.
      - name: Developer-ID sign + notarize macOS binaries
        env:
          # NOT prefixed RCODESIGN_ on purpose: rcodesign reads RCODESIGN_* env vars
          # as config keys (RCODESIGN_SHA256 -> config 'sha256' -> UnknownField), which
          # aborts it before it signs anything. Keep these download vars off that prefix.
          RC_VERSION: '0.29.0' # indygreg/apple-platform-rs apple-codesign release (match MlFront metadata-release)
          RC_SHA256: 'dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002' # of apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          # Same values as the MlFront GitLab macOS-signing variables: the
          # Developer ID p12 + the three App Store Connect API key
          # components. rcodesign encodes the unified
          # notary key JSON from them at runtime, so no pre-encoded secret is needed.
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ASC_API_KEY_BASE64: ${{ secrets.APPLE_ASC_API_KEY_BASE64 }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [ -f dk-dist/dk0-darwin_arm64 ] || [ -f dk-dist/dk0-darwin_x86_64 ] || { echo "no macos binary in dk-dist; skipping"; exit 0; }
          distdir="$PWD/dk-dist"
          url="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RC_VERSION}/apple-codesign-${RC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/rcodesign.tgz"
          echo "${RC_SHA256}  $RUNNER_TEMP/rcodesign.tgz" | sha256sum -c -
          tar -xz --strip-components=1 -C "$RUNNER_TEMP" --wildcards -f "$RUNNER_TEMP/rcodesign.tgz" '*/rcodesign'
          rc="$RUNNER_TEMP/rcodesign"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 -d > "$RUNNER_TEMP/devid.p12"
          # Notarization (and its API key) is best-effort -- a bare Mach-O cannot be
          # stapled anyway, and the Developer ID signature below is the hard gate the
          # installer verifies. So a bad/absent notary key must not fail the release.
          notary_key=""
          if printf '%s' "$APPLE_ASC_API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/authkey.p8" 2>/dev/null \
             && "$rc" encode-app-store-connect-api-key -o "$RUNNER_TEMP/notary.json" \
                  "$APPLE_ASC_ISSUER_ID" "$APPLE_ASC_KEY_ID" "$RUNNER_TEMP/authkey.p8"; then
            notary_key="$RUNNER_TEMP/notary.json"
          else
            echo "::warning::could not build notary key; skipping notarization (Developer ID signing still enforced)"
          fi
          for f in "$distdir"/dk0-darwin_arm64 "$distdir"/dk1-darwin_arm64 "$distdir"/dk0-darwin_x86_64 "$distdir"/dk1-darwin_x86_64; do
            [ -f "$f" ] || continue
            "$rc" sign --p12-file "$RUNNER_TEMP/devid.p12" --p12-password "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
              --code-signature-flags runtime "$f"
            if [ -n "$notary_key" ]; then
              zip -qj "$RUNNER_TEMP/$(basename "$f").zip" "$f"
              "$rc" notary-submit --api-key-file "$notary_key" --wait \
                "$RUNNER_TEMP/$(basename "$f").zip" || echo "::warning::notarization best-effort failed for $f"
            fi
          done
          rm -f "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/authkey.p8" "$RUNNER_TEMP/notary.json"

      # Attests the distribution, publishes the sigstore bundle for values.json
      # as a release asset, and creates the release. A consumer then fetches
      # that bundle beside values.json with a plain download, so importing this
      # release needs no GitHub API token.
      - name: Attest and Release
        uses: diskuv/dk-distribute/attest-release@v4
